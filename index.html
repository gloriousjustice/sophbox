<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SophBox - Boxing Timer</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --font-color: #000000;
            --border-color: #dc2626; /* Red border */
            --accent-color: #2563eb; /* Blue text for combos */
            --ad-bg: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        body {
            background-color: var(--bg-color);
            color: var(--font-color);
            min-height: 100vh;
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            grid-template-rows: 1fr 100px;
            overflow: auto;
        }

        /* --- AD BANNER LAYOUT PLACEMENTS --- */
        .ad-banner {
            background-color: var(--ad-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: 0.8rem;
            border: 1px dashed #d1d5db;
        }
        .ad-left { grid-column: 1; grid-row: 1; }
        .ad-right { grid-column: 3; grid-row: 1; }
        .ad-bottom { grid-column: 1 / span 3; grid-row: 2; }

        /* --- MAIN INTERFACE --- */
        main {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @media (max-width: 900px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }

            .ad-left, .ad-right, .ad-bottom {
                display: none;
            }

            main {
                grid-column: 1;
                grid-row: 1;
                padding: 12px;
            }
        }

        .timer-board {
            width: 100%;
            max-width: 600px;
            border: 8px solid var(--border-color);
            padding: 30px;
            text-align: center;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        @media (max-width: 600px) {
            .timer-board {
                padding: 20px;
                border-width: 6px;
            }

            .time-display {
                font-size: 2.6rem;
            }

            .combo-text {
                font-size: 2.2rem;
            }

            .control-group {
                flex-direction: column;
                align-items: stretch;
            }

            .btn, .config-select {
                width: 100%;
            }
        }

        .status-badge {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--font-color);
            margin-bottom: 10px;
        }

        .status-badge.rest {
            color: var(--border-color);
        }

        .time-display {
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: 8px;
        }

        .round-display {
            font-size: 1.1rem;
            margin-bottom: 24px;
            color: #4b5563;
        }

        /* --- CENTRAL COMBO HUD --- */
        .combo-display-box {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-top: 3px solid var(--font-color);
            border-bottom: 3px solid var(--font-color);
            margin-bottom: 30px;
            padding: 10px;
        }

        .combo-text {
            font-size: 3.2rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .combo-subtext {
            font-size: 1rem;
            color: #6b7280;
            margin-top: 8px;
        }

        /* --- SYSTEM CONTROLS --- */
        .control-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: 3px solid var(--font-color);
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--font-color);
        }

        /* Styling to turn the button red when paused */
        .btn-paused {
            background-color: #dc2626 !important; 
        }

        .config-select {
            padding: 10px;
            font-size: 1rem;
            border: 3px solid var(--font-color);
            background: white;
            cursor: pointer;
        }

        .control-group .config-select {
            min-width: 140px;
        }
    </style>
</head>
<body>

    <!-- Layout placeholders for potential banner ads -->
    <div class="ad-banner ad-left">BANNER_AD_LEFT_200xH</div>
    <div class="ad-banner ad-right">BANNER_AD_RIGHT_200xH</div>
    <div class="ad-banner ad-bottom">LEADERBOARD_AD_BOTTOM_Wxx100</div>

    <main>
        <div class="timer-board">
            <div id="status" class="status-badge">READY</div>
            <div id="timer" class="time-display">03:00</div>
            <div id="round-counter" class="round-display">ROUND 1</div>

            <div class="combo-display-box">
                <div id="combo-screen" class="combo-text">---</div>
                <div id="combo-timer" class="combo-subtext">Waiting to start...</div>
            </div>

            <div class="control-group">
                <select id="round-duration" class="config-select">
                    <option value="180">3 Minute Round</option>
                    <option value="600">10 Minute Round</option>
                </select>
                <button id="start-btn" class="btn" onclick="toggleTimer()">Start</button>
                <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
            </div>
        </div>
    </main>

    <script>
        // --- BOXING COMBO DATABASE ---
        const comboDatabase = {
            3: [
                "1-1-2", "1-2-1", "2-3-2", "8-2-3", "1-3-4B", "2-1-2"
            ],
            4: [
                "1-3-6-3", "2-SR-2-3", "1-2-D-2", "1-Pull-1-2", "1-3-6-5", 
                "8-7-3-2", "2-3-D-3", "1-Pull-2-3", "SR-6-3-2", "4B-3B-6-3", 
                "1-2-3-4B", "Slip-6-3-4B", "1-2-6-2", "4B-3B-4-3", "6B-8-4-3", 
                "1-5-2-5B"
            ],
            5: [
                "1-1-2-3-6-3", "1-8-7-3-2-7", "4B-3B-6-3-8-5", "1-2-3-2-7", 
                "1-SL-3-4-3", "1-2-D-6-3-2", "2-1-1-2-3", "8-7-3-D-3", 
                "1-2B-3-4B-3", "1-SL-3-2-7", "2-SR-6B-6-3", "6-2-5-3-2", 
                "5B-6B-3-4-5-8", "Slip-1-D-B-2", "1-Slip-4-B-L-3-8", "1-5-2-5-B", 
                "2-3-D-1-2", "1-2-D-2-3", "2-1-5-2-3", "2-8-4-6-2", "1-4-4-5-7", 
                "1B-1-8-dip-3", "Slip-Slip-2-1-2-5B", "2-3-dip-8-7", "1-2-6-5B-6B", 
                "Slip-1-D-3-2", "1-Slip-4B-L-3-8"
            ]
        };

        // System Settings
        let timerInterval = null;
        let timeRemaining = 180;
        let isRunning = false;
        let currentMode = 'work';
        let currentRound = 1;
        let comboTimeLeftRemaining = 0;
        let currentComboText = '';
        let comboVoiceInterval = null;

        let bellAudio = null;

        function playBell() {
            if (!bellAudio) {
                bellAudio = new Audio('bell.mp3.mp3');
                bellAudio.preload = 'auto';
            }

            bellAudio.currentTime = 0;
            bellAudio.play().catch(() => {
                // Ignore autoplay restrictions until the user interacts with the page.
            });
        }

        // Voice Reader Engines
        function speakCombo(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const spokenText = text.replace(/-/g, ' ')
                    .replace(/B/g, ' Body ')
                    .replace(/D/g, ' Duck ')
                    .replace(/SR/g, ' Slip Right ')
                    .replace(/SL/g, ' Slip Left ');
                const utterance = new SpeechSynthesisUtterance(spokenText);
                utterance.rate = 1.15;
                utterance.pitch = 1.45;
                utterance.volume = 1;
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateDisplay() {
            const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const secs = (timeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${mins}:${secs}`;
            document.getElementById('round-counter').textContent = `ROUND ${currentRound}`;
        }

        function setStartButtonState(isPaused) {
            const startBtn = document.getElementById('start-btn');
            startBtn.textContent = isPaused ? 'Pause' : 'Start';
            startBtn.classList.toggle('btn-paused', isPaused);
        }

        function clearTimerInterval() {
            if (timerInterval !== null) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function stopComboVoiceLoop() {
            if (comboVoiceInterval !== null) {
                clearInterval(comboVoiceInterval);
                comboVoiceInterval = null;
            }
        }

        function startComboVoiceLoop() {
            stopComboVoiceLoop();
            if (currentMode !== 'work' || !currentComboText) return;

            comboVoiceInterval = setInterval(() => {
                if (currentMode === 'work' && currentComboText) {
                    speakCombo(currentComboText);
                }
            }, 5000);
        }

        function toggleTimer() {
            if (isRunning) {
                clearTimerInterval();
                stopComboVoiceLoop();
                isRunning = false;
                setStartButtonState(false);
                return;
            }

            if (document.getElementById('status').textContent === 'READY') {
                timeRemaining = parseInt(document.getElementById('round-duration').value, 10);
                currentMode = 'work';
                currentRound = 1;
                document.getElementById('status').textContent = '';
                document.getElementById('status').className = 'status-badge';
                playBell();
                triggerNewComboInterval();
            }

            isRunning = true;
            setStartButtonState(true);
            timerInterval = setInterval(tick, 1000);
        }

        function resetTimer() {
            clearTimerInterval();
            isRunning = false;
            currentMode = 'work';
            currentRound = 1;
            comboTimeLeftRemaining = 0;
            currentComboText = '';
            stopComboVoiceLoop();
            timeRemaining = parseInt(document.getElementById('round-duration').value, 10);

            setStartButtonState(false);

            document.getElementById('status').textContent = 'READY';
            document.getElementById('status').className = 'status-badge';
            document.getElementById('combo-screen').textContent = '---';
            document.getElementById('combo-timer').textContent = 'Waiting to start...';
            updateDisplay();
        }

        function tick() {
            if (timeRemaining > 0) {
                timeRemaining--;
                updateDisplay();

                if (currentMode === 'work' && comboTimeLeftRemaining > 0) {
                    comboTimeLeftRemaining--;
                    document.getElementById('combo-timer').textContent = `Next combo in ${comboTimeLeftRemaining}s`;
                    if (comboTimeLeftRemaining === 0) {
                        triggerNewComboInterval();
                    }
                }
            } else {
                playBell();
                if (currentMode === 'work') {
                    currentMode = 'rest';
                    stopComboVoiceLoop();
                    timeRemaining = 58;
                    document.getElementById('status').textContent = '';
                    document.getElementById('status').className = 'status-badge rest';
                    document.getElementById('combo-screen').textContent = 'BREATHE';
                    document.getElementById('combo-timer').textContent = 'Recover...';
                    comboTimeLeftRemaining = 0;
                } else {
                    currentMode = 'work';
                    currentRound += 1;
                    timeRemaining = parseInt(document.getElementById('round-duration').value, 10);
                    document.getElementById('status').textContent = '';
                    document.getElementById('status').className = 'status-badge';
                    triggerNewComboInterval();
                }
                updateDisplay();
            }
        }

        function triggerNewComboInterval() {
            if (currentMode !== 'work') return;

            const categories = [3, 4, 5];
            const chosenCategory = categories[Math.floor(Math.random() * categories.length)];
            const pool = comboDatabase[chosenCategory];
            const randomCombo = pool[Math.floor(Math.random() * pool.length)];

            if (chosenCategory === 3) {
                comboTimeLeftRemaining = 30;
            } else if (chosenCategory === 4) {
                comboTimeLeftRemaining = 45;
            } else if (chosenCategory === 5) {
                comboTimeLeftRemaining = 60;
            }

            currentComboText = randomCombo;
            document.getElementById('combo-screen').textContent = randomCombo;
            speakCombo(randomCombo);
            startComboVoiceLoop();
            document.getElementById('combo-timer').textContent = `Next combo in ${comboTimeLeftRemaining}s`;
        }

        updateDisplay();
    </script>
</body>
</html>
